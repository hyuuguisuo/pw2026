{% extends "locadora/modelo.html" %}

{% block title %}Verifique seu e-mail | CINEMAIF{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="form-card-glass shadow-lg text-center">
            <i class="bi bi-envelope-check text-warning fs-1"></i>
            <h1 class="h3 text-white mt-3">Verifique seu e-mail</h1>
            <p class="text-secondary">Se existir uma conta associada ao endereço informado, enviaremos um link para redefinir a senha.</p>
            <a href="{% url 'login' %}" class="btn-primary-gold mt-2">Voltar ao login</a>
        </div>
    </div>
</div>
{% endblock %}
